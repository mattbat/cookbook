# Builds the cookbook, runs every test, and publishes to GitHub Pages.
# A push to master (including adding a recipe on github.com) publishes only if all tests pass;
# otherwise the live site stays as it was and the run shows what broke.
name: Build, test and publish

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  # Cancel superseded PR runs, but never cut off a publish halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Smaller copies of the photos take a while to make; reuse the ones from earlier runs
      - name: Reuse resized photos
        uses: actions/cache@v4
        with:
          path: .cache/photos
          key: photos-${{ hashFiles('img/**', 'lib/photos.js') }}
          restore-keys: photos-

      - name: Check recipes and unit tests
        run: npm run test:unit

      - name: Build site
        run: npm run build

      - name: Check built site
        run: npm run test:build

      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser tests (iPhone, Android, desktop)
        run: npm run test:e2e

      - name: Save browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Package site for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish:
    needs: test
    # Off until the cutover: set the repository variable PAGES_DEPLOY to "actions"
    # after switching Settings -> Pages -> Source to "GitHub Actions".
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.PAGES_DEPLOY == 'actions'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
